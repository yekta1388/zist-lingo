<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>زیست‌لینگو</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { 
      box-sizing: border-box; 
      font-family: system-ui, -apple-system, sans-serif; 
      margin: 0; padding: 0; 
      -webkit-user-select: none; /* جلوگیری از انتخاب متن */
      user-select: none;
      -webkit-touch-callout: none;
    }
    body { background-color: #131f24; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; overflow-x: hidden; }
    
    /* لایه مات‌کننده برای جلوگیری از اسکرین‌شات و جابجایی برنامه‌ها */
    #privacy-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #131f24;
      z-index: 9999;
      justify-content: center;
      align-items: center;
      font-size: 18px;
    }

    /* واترمارک نامحسوس */
    .watermark {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 28px;
      color: rgba(255, 255, 255, 0.04);
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }

    .card { width: 100%; max-width: 400px; background: #202f36; padding: 24px; border-radius: 20px; border: 2px solid #37464f; text-align: center; }
    .input-box { width: 100%; padding: 14px; border-radius: 12px; border: 2px solid #37464f; background: #131f24; color: #fff; font-size: 16px; margin: 20px 0; text-align: center; outline: none; }
    .input-box:focus { border-color: #58cc02; }
    .btn { width: 100%; padding: 14px; border: none; border-bottom: 4px solid #58a700; border-radius: 12px; background: #58cc02; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
    .btn:active { transform: translateY(2px); border-bottom-width: 2px; }
    .error-text { color: #ea2b2b; font-size: 14px; margin-top: 10px; display: none; }

    /* صفحه اصلی برنامه (کوئیز) */
    #app-screen { display: none; width: 100%; max-width: 420px; flex-direction: column; min-height: 90vh; justify-content: space-between; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #202f36; border-radius: 16px; font-weight: bold; font-size: 18px; }
    .stat { display: flex; align-items: center; gap: 6px; }
    .hearts { color: #ff4b4b; }
    .xp { color: #ffc800; }
    .question-box { margin-top: 30px; text-align: center; }
    .question-title { font-size: 20px; margin-bottom: 24px; line-height: 1.6; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .option-btn { background: #202f36; border: 2px solid #37464f; border-bottom: 5px solid #37464f; color: #fff; padding: 16px; border-radius: 16px; font-size: 16px; cursor: pointer; text-align: right; }
    .option-btn.correct { background: #58cc02; border-color: #58a700; color: #fff; }
    .option-btn.wrong { background: #ea2b2b; border-color: #ba1717; color: #fff; }
    .footer-action { margin-top: 24px; }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="privacy-overlay">محیط امن زیست‌لینگو</div>
  <div class="watermark" id="watermark-tag">ZIST-PROTECTED</div>

  <!-- فرم فعال‌سازی لایسنس -->
  <div class="card" id="login-screen">
    <h2>ورود به زیست‌لینگو</h2>
    <p style="color: #afbbbe; font-size: 14px; margin-top: 8px;">لایسنس یک‌بار مصرف اختصاصی خود را وارد کنید:</p>
    <input type="text" id="license-input" class="input-box" placeholder="ZIST-VIP-..." autocomplete="off">
    <button class="btn" onclick="submitLicense()">فعال‌سازی و ورود</button>
    <div id="login-error" class="error-text"></div>
  </div>

  <!-- محیط آزمون -->
  <div id="app-screen">
    <div class="top-bar">
      <div class="stat hearts">❤️ <span id="hearts-count">5</span></div>
      <div class="stat xp">⚡ <span id="xp-count">0</span> XP</div>
    </div>

    <div class="question-box">
      <div class="question-title" id="question-text">در حال بارگذاری سوال...</div>
      <div class="options-grid" id="options-container"></div>
    </div>

    <div class="footer-action">
      <button class="btn" id="next-btn" onclick="nextQuestion()" style="display: none;">سوال بعدی</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://juuqpelrxqfnuenophfp.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_vJxwPHdWSlRUbI13svBYcA_25BOpLzR";
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // تولید یا خواندن شناسه یکتای دستگاه
    function getDeviceId() {
      let devId = localStorage.getItem('zist_device_id');
      if (!devId) {
        devId = 'dev_' + Math.random().toString(36).substring(2, 15);
        localStorage.setItem('zist_device_id', devId);
      }
      return devId;
    }

    // بررسی ورود قبلی
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('zist_license');
      if (savedKey) {
        verifySession(savedKey);
      }
    });

    async function verifySession(key) {
      const devId = getDeviceId();
      const { data, error } = await client.rpc('activate_license', { key_input: key, dev_id: devId });
      if (data && data.success) {
        showApp(key);
      } else {
        localStorage.removeItem('zist_license');
      }
    }

    async function submitLicense() {
      const key = document.getElementById('license-input').value.trim();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      if (!key) {
        errBox.innerText = 'لطفاً کد لایسنس را وارد کنید.';
        errBox.style.display = 'block';
        return;
      }

      const devId = getDeviceId();
      const { data, error } = await client.rpc('activate_license', { key_input: key, dev_id: devId });

      if (error || !data.success) {
        errBox.innerText = data ? data.message : 'خطا در برقراری ارتباط با سرور.';
        errBox.style.display = 'block';
        return;
      }

      localStorage.setItem('zist_license', key);
      showApp(key);
    }

    function showApp(key) {
      document.getElementById('login-screen').style.display = 'none';
      const appScreen = document.getElementById('app-screen');
      appScreen.style.display = 'flex';
      document.getElementById('watermark-tag').innerText = key + ' • ' + getDeviceId().substring(0, 8);
      loadQuestions();
    }

    // تمهیدات ضد اسکرین‌شات و امنیت صفحه
    const overlay = document.getElementById('privacy-overlay');
    window.addEventListener('blur', () => { overlay.style.display = 'flex'; });
    window.addEventListener('focus', () => { overlay.style.display = 'none'; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) overlay.style.display = 'flex';
      else overlay.style.display = 'none';
    });

    // جریان سوالات
    let questions = [];
    let currentIndex = 0;
    let hearts = 5;
    let xp = 0;

    async function loadQuestions() {
      const { data, error } = await client.from('questions').select('*');
      if (error || !data || data.length === 0) {
        document.getElementById('question-text').innerText = "خطا در دریافت سوالات.";
        return;
      }
      questions = data;
      showQuestion();
    }

    function showQuestion() {
      document.getElementById('next-btn').style.display = 'none';
      const q = questions[currentIndex];
      document.getElementById('question-text').innerText = q.question_text;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      const options = [
        { key: 'A', text: q.option_a },
        { key: 'B', text: q.option_b },
        { key: 'C', text: q.option_c },
        { key: 'D', text: q.option_d }
      ];

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = opt.text;
        btn.onclick = () => selectAnswer(btn, opt.key, q.correct_option);
        container.appendChild(btn);
      });
    }

    function selectAnswer(btn, selectedKey, correctKey) {
      const buttons = document.querySelectorAll('.option-btn');
      buttons.forEach(b => b.disabled = true);

      if (selectedKey === correctKey) {
        btn.classList.add('correct');
        xp += 10;
        document.getElementById('xp-count').innerText = xp;
      } else {
        btn.classList.add('wrong');
        hearts = Math.max(0, hearts - 1);
        document.getElementById('hearts-count').innerText = hearts;
      }

      document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
      if (hearts <= 0) {
        alert("فرصت‌های شما تمام شد!");
        location.reload();
        return;
      }
      currentIndex++;
      if (currentIndex < questions.length) {
        showQuestion();
      } else {
        document.getElementById('question-text').innerText = "آفرین! این مرحله تمام شد 🎉";
        document.getElementById('options-container').innerHTML = '';
        document.getElementById('next-btn').style.display = 'none';
      }
    }
  </script>
</body>
</html>
